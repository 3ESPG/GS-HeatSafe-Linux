# =============================================================================
# HeatSafe · config/heatsafe.conf
# Configuração central da infraestrutura. TODOS os scripts leem este arquivo.
# Mude os valores aqui, nunca dentro dos scripts.
# (Arquivo em sintaxe Bash: VAR="valor", sem espaços em volta do "=")
# =============================================================================

# ---------- Identidade do servidor ----------
HS_HOSTNAME="heatsafe-srv"
HS_DOMAIN="heatsafe.local"
HS_TIMEZONE="America/Sao_Paulo"

# ---------- Rede (IP) ----------
# NET_MODE="static" -> fixa o IP. Se NET_IP ficar vazio, fixa o IP que a VM tem agora.
# NET_MODE="dhcp"   -> mantém DHCP e só define os servidores DNS.
NET_MODE="static"
NET_IFACE=""                 # vazio = interface da rota padrão (ex.: enp0s3)
NET_IP=""                    # ex.: "192.168.56.10/24"  (vazio = IP atual)
NET_GATEWAY=""               # ex.: "192.168.56.1"      (vazio = gateway atual)
NET_DNS="1.1.1.1,8.8.8.8"    # DNS externos (separados por vírgula)

# ---------- DNS local (/etc/hosts) ----------
# Nomes que apontam para o IP do servidor
HS_DNS_NAMES="heatsafe.local api.heatsafe.local previsao.heatsafe.local monitor.heatsafe.local"

# ---------- Usuário de serviço ----------
HS_USER="heatsafe"           # conta de sistema, sem login, que roda a API e o serviço
HS_GROUP="heatsafe"
HS_ADMIN_USER=""             # vazio = quem rodou o sudo; entra no grupo heatsafe para ler os logs

# ---------- Diretórios ----------
HS_BASE="/opt/heatsafe"
HS_APP_DIR="$HS_BASE/app"            # código-fonte dos repositórios (app/api e app/previsao)
HS_API_DIR="$HS_BASE/api"            # API C# publicada (dotnet publish)
HS_PREVISAO_DIR="$HS_BASE/previsao"  # .jar do serviço de previsão
HS_ETC="/etc/heatsafe"
HS_ENV_API="$HS_ETC/api.env"            # variáveis de ambiente da API (com segredos)
HS_ENV_PREVISAO="$HS_ETC/previsao.env"  # variáveis de ambiente do serviço de previsão (com segredos)
HS_DATA="/var/lib/heatsafe"          # banco SQLite da API e estado do monitor
HS_LOG="/var/log/heatsafe"           # TODOS os logs de execução e auditoria
HS_BACKUP="/var/backups/heatsafe"    # cópias dos arquivos de sistema antes de alterar
HS_STATUS_DIR="/var/www/heatsafe-status"  # página de status servida pelo nginx

# ---------- Código da aplicação (repositórios do grupo) ----------
# API central C# (.NET) — repositório HeatSafe-Backend
API_REPO_URL="https://github.com/GustavooHM/HeatSafe-Backend.git"
API_REPO_BRANCH="master"
API_CSPROJ="HeatSafe.Api/HeatSafe.Api.csproj"   # projeto Web dentro do repositório
API_CONN_NAME="HeatSafe"                        # nome em ConnectionStrings:<nome> lido pela API
DOTNET_CHANNEL=""            # vazio = lê o <TargetFramework> do .csproj (net10.0 -> 10.0)
ASPNET_ENV="Development"     # Development liga o Swagger e os usuários de demonstração da API

# Serviço de previsão (SOA) Java/Spring Boot + MySQL — repositório GS-HeatSafe-SOA
PREVISAO_REPO_URL="https://github.com/3ESPG/GS-HeatSafe-SOA.git"
PREVISAO_REPO_BRANCH="main"
JAVA_VERSION="21"
JAVA_OPTS="-Xms128m -Xmx512m -XX:+UseSerialGC"
MYSQL_DB="heatsafe"
MYSQL_USER="heatsafe"

# ---------- Portas internas (só em 127.0.0.1; o nginx expõe tudo na porta 80) ----------
API_PORT=5000
PREVISAO_PORT=8000
API_HEALTH_PATH="/health"
PREVISAO_HEALTH_PATH="/health"
API_DOCS_PATH="/swagger/index.html"
PREVISAO_DOCS_PATH="/swagger-ui.html"

# ---------- Monitoramento ----------
MON_INTERVAL=15              # segundos entre as leituras
CPU_WARN=70;  CPU_CRIT=90    # % de uso
MEM_WARN=75;  MEM_CRIT=90
DISK_WARN=80; DISK_CRIT=90
DISK_MOUNTS="/ /var"         # pontos de montagem verificados (repetidos são ignorados)
MON_CPU_SUSTAIN=2            # leituras seguidas acima do limite para alertar CPU (ignora picos)
MON_REPEAT_MIN=10            # repete um alerta que continua ativo a cada N minutos (sem spam)
HEARTBEAT_MAX_AGE=45         # segundos sem "batimento" = monitor travado (healthcheck reinicia)
ALERT_WEBHOOK_URL=""         # opcional: webhook do Discord/Slack/Teams para receber os alertas
